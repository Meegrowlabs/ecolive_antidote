[build]
  publish = "."
  command = "node generate-posts.js"

[build.environment]
  NODE_VERSION = "18"

# Clean blog URL: ecolive.in/blog → blog.html
[[redirects]]
  from   = "/blog"
  to     = "/blog.html"
  status = 200
  force  = true

# Clean post URLs: ecolive.in/blog/:slug → posts/:slug.html
[[redirects]]
  from   = "/blog/:slug"
  to     = "/posts/:slug.html"
  status = 200
  force  = true

# Legacy .html → clean URL (301 permanent)
[[redirects]]
  from   = "/blog.html"
  to     = "/blog"
  status = 301

# SPA fallback
[[redirects]]
  from = "/*"
  to   = "/index.html"
  status = 200
