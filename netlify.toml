[build]
  publish = "."
  command = "node generate-posts.js"

[build.environment]
  NODE_VERSION = "18"

# === Blog listing page ===
[[redirects]]
  from   = "/blog"
  to     = "/blog.html"
  status = 200
  force  = true

# === 9 existing static posts (priority — served by Netlify CDN) ===
[[redirects]]
  from   = "/blog/reduce-reuse-recycle-recharge-priority-order-india"
  to     = "/posts/reduce-reuse-recycle-recharge-priority-order-india.html"
  status = 200

[[redirects]]
  from   = "/blog/why-water-quality-is-the-foundation-of-indias-human-and-economic-growth"
  to     = "/posts/why-water-quality-is-the-foundation-of-indias-human-and-economic-growth.html"
  status = 200

[[redirects]]
  from   = "/blog/why-fair-water-pricing-can-make-india-water-positive"
  to     = "/posts/why-fair-water-pricing-can-make-india-water-positive.html"
  status = 200

[[redirects]]
  from   = "/blog/navratras-the-ancient-blueprint-for-cleansing-mind-body-and-planet"
  to     = "/posts/navratras-the-ancient-blueprint-for-cleansing-mind-body-and-planet.html"
  status = 200

[[redirects]]
  from   = "/blog/the-4r-water-framework-how-reduce-reuse-recycle-recharge-can-make-your-facility-water-positive"
  to     = "/posts/the-4r-water-framework-how-reduce-reuse-recycle-recharge-can-make-your-facility-water-positive.html"
  status = 200

[[redirects]]
  from   = "/blog/gas-has-alternatives-water-doesnt"
  to     = "/posts/gas-has-alternatives-water-doesnt.html"
  status = 200

[[redirects]]
  from   = "/blog/jal-mahotsav-2026-what-president-murmus-national-duty-call-means-for-indian-corporates"
  to     = "/posts/jal-mahotsav-2026-what-president-murmus-national-duty-call-means-for-indian-corporates.html"
  status = 200

[[redirects]]
  from   = "/blog/industrial-rainwater-harvesting-india-roi-guide"
  to     = "/posts/industrial-rainwater-harvesting-india-roi-guide.html"
  status = 200

[[redirects]]
  from   = "/blog/brsr-2025-26-what-changed-how-to-prepare-your-water-esg-reporting"
  to     = "/posts/brsr-2025-26-what-changed-how-to-prepare-your-water-esg-reporting.html"
  status = 200

# === Fallback: any other /blog/* proxies to WordPress on Hostinger ===
[[redirects]]
  from   = "/blog/*"
  to     = "https://cms.ecolive.in/blog/:splat"
  status = 200
  force  = true

# === WordPress assets proxied transparently ===
[[redirects]]
  from   = "/wp-content/*"
  to     = "https://cms.ecolive.in/wp-content/:splat"
  status = 200
  force  = true

[[redirects]]
  from   = "/wp-includes/*"
  to     = "https://cms.ecolive.in/wp-includes/:splat"
  status = 200
  force  = true

[[redirects]]
  from   = "/wp-json/*"
  to     = "https://cms.ecolive.in/wp-json/:splat"
  status = 200
  force  = true

# === Legacy .html → clean URL (301 permanent) ===
[[redirects]]
  from   = "/blog.html"
  to     = "/blog"
  status = 301

# === SPA fallback ===
[[redirects]]
  from = "/*"
  to   = "/index.html"
  status = 200
