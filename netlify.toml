[build]
  publish = "."
  command = "echo 'No build step — static repo + WordPress proxy.'"

[build.environment]
  NODE_VERSION = "18"

# === Blog listing page (static) ===
[[redirects]]
  from   = "/blog"
  to     = "/blog.html"
  status = 200
  force  = true

# === All /blog/* requests proxy to WordPress on Hostinger ===
[[redirects]]
  from   = "/blog/*"
  to     = "https://cms.ecolive.in/blog/:splat"
  status = 200
  force  = true

# === WordPress assets ===
[[redirects]]
  from   = "/wp-content/*"
  to     = "https://cms.ecolive.in/wp-content/:splat"
  status = 200
  force  = true

[[redirects]]
  from   = "/wp-includes/*"
  to     = "https://cms.ecolive.in/wp-includes/:splat"
  status = 200
  force  = true

[[redirects]]
  from   = "/wp-json/*"
  to     = "https://cms.ecolive.in/wp-json/:splat"
  status = 200
  force  = true

# === WP sitemap (for search engines) ===
[[redirects]]
  from   = "/wp-sitemap.xml"
  to     = "https://cms.ecolive.in/wp-sitemap.xml"
  status = 200
  force  = true

[[redirects]]
  from   = "/wp-sitemap-*"
  to     = "https://cms.ecolive.in/wp-sitemap-:splat"
  status = 200
  force  = true

# === Legacy .html → clean URL (301 permanent) ===
[[redirects]]
  from   = "/blog.html"
  to     = "/blog"
  status = 301

# === SPA fallback ===
[[redirects]]
from = "/*"
to = "/index.html"
status = 200

# === Browser Caching Headers ===
[[headers]]
for = "/*"
[headers.values]
X-Content-Type-Options = "nosniff"

[[headers]]
for = "*.webp"
[headers.values]
Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
for = "*.jpg"
[headers.values]
Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
for = "*.png"
[headers.values]
Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
for = "*.svg"
[headers.values]
Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
for = "*.css"
[headers.values]
Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
for = "*.js"
[headers.values]
Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
for = "*.woff2"
[headers.values]
Cache-Control = "public, max-age=31536000, immutable"

# === Security Headers ===
[[headers]]
for = "/*"
[headers.values]
X-Frame-Options = "DENY"
X-Content-Type-Options = "nosniff"
X-XSS-Protection = "1; mode=block"
Referrer-Policy = "strict-origin-when-cross-origin"
Permissions-Policy = "geolocation=(self), microphone=()"
